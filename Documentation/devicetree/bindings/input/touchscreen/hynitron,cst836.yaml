%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/hynitron,cst836.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hynitron CST836 touchscreen controller

maintainers:
  - itskenny0 <0@kenny.cat>

description:
  Self-capacitance controller with two contacts and an 8-bit register address.
  The CST328 mutual-capacitance protocol is not compatible with this binding.

allOf:
  - $ref: touchscreen.yaml#

properties:
  compatible:
    const: hynitron,cst836

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1
    description: Active-low reset line.

  touchscreen-size-x:
    minimum: 1
    maximum: 4096

  touchscreen-size-y:
    minimum: 1
    maximum: 4096

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios
  - touchscreen-size-x
  - touchscreen-size-y

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@15 {
            compatible = "hynitron,cst836";
            reg = <0x15>;
            interrupt-parent = <&gpio>;
            interrupts = <0 IRQ_TYPE_EDGE_FALLING>;
            reset-gpios = <&gpio 174 GPIO_ACTIVE_LOW>;
            touchscreen-size-x = <480>;
            touchscreen-size-y = <640>;
        };
    };
