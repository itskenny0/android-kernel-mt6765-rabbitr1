name: haretic

on:
  push:
    branches:
      - mt6765-devel
      - 'rabbit-r1/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rabbit-r1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TMPDIR: /rabbitr1/.tmp
  XDG_CACHE_HOME: /rabbitr1/.cache
  XDG_CONFIG_HOME: /rabbitr1/.cache/config
  XDG_DATA_HOME: /rabbitr1/.cache/data
  GIT_CONFIG_GLOBAL: /rabbitr1/.gitconfig
  GIT_CONFIG_NOSYSTEM: '1'
  GIT_TERMINAL_PROMPT: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  JOBS: '4'

jobs:
  build:
    name: Mainline build and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: /rabbitr1
    steps:
      # Fetch directly into the fixed workspace used by the build scripts.
      # GITHUB_SHA is the PR merge commit for pull_request events.
      - name: Check out the tested commit
        working-directory: ${{ github.workspace }}
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /rabbitr1
          mkdir -p /rabbitr1/src/mainline /rabbitr1/.tmp /rabbitr1/.cache /rabbitr1/logs
          git -C /rabbitr1/src/mainline init
          git -C /rabbitr1/src/mainline remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C /rabbitr1/src/mainline fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C /rabbitr1/src/mainline checkout --detach FETCH_HEAD
          test "$(git -C /rabbitr1/src/mainline rev-parse HEAD)" = "$GITHUB_SHA"
          python3 /rabbitr1/src/mainline/rabbit-r1/scripts/install-workspace.py

      - name: Install runner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            bc binutils-arm-linux-gnueabihf bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libelf-dev libssl-dev clang openjdk-21-jdk-headless \
            python3 python3-venv qemu-user zstd

      - name: Set up boot image tools
        run: |
          source scripts/env.sh
          python3 -m venv toolchains/boot-tools
          toolchains/boot-tools/bin/pip install -r configs/boot-tools-requirements.txt

      - name: Read source pins
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json
          from pathlib import Path
          data = Path('sources.lock.json').read_bytes()
          tool_pins = Path('android/lp-tools.json').read_bytes()
          print('cache-key=' + hashlib.sha256(data + tool_pins).hexdigest())
          print('patch-base=' + json.loads(data)['repositories']['mainline']['commit'])
          PY

      - name: Cache verified source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /rabbitr1/downloads/busybox-1.37.0.tar.bz2
            /rabbitr1/downloads/rabbit_OS_v0.8.293.zip
            /rabbitr1/downloads/mtklogo-v0.1.2.tgz
            /rabbitr1/downloads/mtkclient-v2.1.4.1.tar.gz
            /rabbitr1/downloads/android-lp
          key: r1-sources-v2-${{ runner.os }}-${{ steps.pins.outputs.cache-key }}

      - name: Fetch build inputs
        env:
          PATCH_BASE: ${{ steps.pins.outputs.patch-base }}
        run: |
          source scripts/env.sh
          python3 scripts/test-source-downloads.py 2>&1 | tee logs/source-download-tests.log
          git -C src/mainline fetch --no-tags --depth=1 origin "$PATCH_BASE"
          python3 scripts/fetch-sources.py --profile ci 2>&1 | tee logs/fetch-ci.log

      - name: Check read-only ADB backup receiver with fake processes
        run: |
          source scripts/env.sh
          mkdir -p out
          python3 scripts/test-adb-backup.py \
            --out /rabbitr1/out/adb-backup-tests 2>&1 | tee logs/adb-backup-tests.log

      - name: Check mtkclient transfers and read failures
        run: |
          source scripts/env.sh
          mkdir -p out
          python3 scripts/prepare-mtkclient.py 2>&1 | tee logs/mtkclient-prepare.log
          python3 scripts/prepare-mtkclient.py --check 2>&1 | tee logs/mtkclient-check.log
          python3 scripts/test-mtkclient-preparer.py \
            --out /rabbitr1/out/mtkclient-preparer-tests 2>&1 | tee logs/mtkclient-preparer-tests.log
          python3 scripts/test-runtime-workspace.py \
            --out /rabbitr1/out/runtime-workspace-tests 2>&1 | tee logs/runtime-workspace-tests.log
          python3 scripts/test-mtkclient-transport.py \
            --original /rabbitr1/src/mtkclient \
            --candidate /rabbitr1/src/mtkclient-haretic \
            --fixtures /rabbitr1/tests/mtkclient/fixtures \
            --out /rabbitr1/out/mtkclient-transport-tests 2>&1 | tee logs/mtkclient-transport-tests.log
          python3 scripts/test-mtkclient-xflash-read.py \
            --source /rabbitr1/src/mtkclient-haretic \
            --out /rabbitr1/out/mtkclient-xflash-read-tests 2>&1 | tee logs/mtkclient-xflash-read-tests.log
          python3 scripts/test-mtkclient-cid.py \
            --source /rabbitr1/src/mtkclient-haretic \
            --out /rabbitr1/out/mtkclient-cid-tests 2>&1 | tee logs/mtkclient-cid-tests.log
          python3 scripts/test-mtkclient-gpt.py \
            --source /rabbitr1/src/mtkclient-haretic \
            --original /rabbitr1/src/mtkclient \
            --out /rabbitr1/out/mtkclient-gpt-tests 2>&1 | tee logs/mtkclient-gpt-tests.log

      - name: Check source and logging helpers
        run: |
          source scripts/env.sh
          python3 scripts/test-install-layout.py \
            --out /rabbitr1/out/install-layout-tests 2>&1 | tee logs/install-layout-tests.log
          python3 scripts/test-initramfs-usb.py \
            --out /rabbitr1/out/initramfs-usb-tests 2>&1 | tee logs/initramfs-usb-tests.log
          python3 scripts/check-patches.py 2>&1 | tee logs/patch-check.log
          python3 scripts/test-android-patches.py 2>&1 | tee logs/android-patches-tests.log
          python3 scripts/test-r1-webview-lfs.py 2>&1 | tee logs/webview-lfs-tests.log
          python3 scripts/prepare-lp-tools.py 2>&1 | tee logs/lp-tools-prepare.log
          python3 scripts/test-android-super.py \
            --lpmake /rabbitr1/toolchains/android-lp/bin/lpmake \
            --out /rabbitr1/out/android-super/ci-tests 2>&1 | tee logs/android-super-tests.log
          python3 scripts/test-android-super-audit.py \
            --lpmake /rabbitr1/toolchains/android-lp/bin/lpmake \
            --out /rabbitr1/out/android-super/ci-audit-profile-tests 2>&1 | tee logs/android-super-audit-tests.log
          python3 scripts/test-android-sparse.py 2>&1 | tee logs/android-sparse-tests.log
          python3 scripts/test-android-pmsg.py 2>&1 | tee logs/android-pmsg-tests.log
          python3 scripts/test-android-pstore-collection.py 2>&1 | tee logs/android-pstore-collection-tests.log
          python3 scripts/test-mt6357.py 2>&1 | tee logs/mt6357-tests.log
          python3 scripts/test-mt6357-auxadc.py 2>&1 | tee logs/mt6357-auxadc-tests.log
          python3 scripts/test-mt6357-imp.py 2>&1 | tee logs/mt6357-imp-tests.log
          python3 scripts/test-mt6357-current.py 2>&1 | tee logs/mt6357-current-tests.log
          python3 scripts/test-power-supply-parent.py 2>&1 | tee logs/power-supply-parent-tests.log
          python3 scripts/test-mt6357-status.py 2>&1 | tee logs/mt6357-status-tests.log
          python3 scripts/test-mt6357-live.py 2>&1 | tee logs/mt6357-live-tests.log
          python3 scripts/test-mt6357-soc.py 2>&1 | tee logs/mt6357-soc-tests.log
          python3 scripts/test-mt6357-rtc-nvmem.py 2>&1 | tee logs/mt6357-rtc-nvmem-tests.log
          python3 scripts/test-mt6357-boot-snapshot.py 2>&1 | tee logs/mt6357-boot-snapshot-tests.log
          python3 battery/tests/run.py 2>&1 | tee logs/battery-profile-tests.log
          python3 scripts/test-mt6370.py 2>&1 | tee logs/mt6370-tests.log
          python3 scripts/test-mt6370-limits.py 2>&1 | tee logs/mt6370-limits-tests.log
          python3 scripts/test-mt6370-current.py 2>&1 | tee logs/mt6370-current-tests.log
          python3 scripts/test-musb-budget.py 2>&1 | tee logs/musb-budget-tests.log
          python3 scripts/test-r1-charging.py 2>&1 | tee logs/r1-charging-tests.log
          python3 scripts/test-r1-charging-suppliers.py 2>&1 | tee logs/r1-charging-suppliers-tests.log
          python3 scripts/test-mt6765-power.py \
            --source /rabbitr1/src/mainline \
            --out /rabbitr1/out/mt6765-power-ci 2>&1 | tee logs/mt6765-power-tests.log
          python3 scripts/test-android-charging.py 2>&1 | tee logs/android-charging-tests.log
          python3 scripts/test-r1-boot-control.py 2>&1 | tee logs/r1-boot-control-tests.log
          python3 scripts/test-mt6370-backlight.py 2>&1 | tee logs/mt6370-backlight-tests.log
          python3 scripts/test-dsi-transfer.py 2>&1 | tee logs/dsi-transfer-tests.log
          python3 scripts/test-i2c.py 2>&1 | tee logs/i2c-tests.log
          python3 scripts/test-i2c-irq.py 2>&1 | tee logs/i2c-irq-tests.log
          python3 scripts/test-cst836.py 2>&1 | tee logs/cst836-tests.log
          python3 scripts/test-expdb.py 2>&1 | tee logs/expdb-tests.log
          python3 scripts/test-pstore-credentials.py 2>&1 | tee logs/pstore-credentials-tests.log
          python3 scripts/test-health-readiness.py 2>&1 | tee logs/health-readiness-tests.log
          python3 android/device/logging/tests/run.py 2>&1 | tee logs/android-expdb-loader-tests.log

      - name: Build the kernel and modules
        run: bash scripts/build-mainline.sh

      - name: Check Health product and kernel agreement
        run: |
          source scripts/env.sh
          python3 scripts/test-health-mode.py 2>&1 | tee logs/health-mode-tests.log

      - name: Compile the inactive display drivers
        run: |
          source scripts/env.sh
          make -C src/mainline O=/rabbitr1/out/mainline ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- drivers/gpu/drm/mediatek/mtk_dsi.o \
            drivers/gpu/drm/mediatek/mtk_drm_drv.o \
            drivers/gpu/drm/mediatek/mtk_disp_rdma.o \
            drivers/gpu/drm/mediatek/mtk_disp_ovl.o \
            drivers/gpu/drm/mediatek/mtk_plane.o \
            drivers/gpu/drm/mediatek/mtk_crtc.o \
            drivers/gpu/drm/mediatek/mtk_ddp_comp.o \
            2>&1 | tee logs/mt6765-dsi-build.log

      - name: Compile the inactive PowerVR driver
        run: |
          source scripts/env.sh
          trap 'for file in audit.json build.log; do if [[ -f "out/powervr-check/$file" ]]; then cp "out/powervr-check/$file" "logs/powervr-$file"; fi; done' EXIT
          bash scripts/compile-powervr.sh 2>&1 | tee logs/powervr-compile.log

      - name: Build the diagnostic initramfs
        run: bash scripts/build-initramfs.sh

      - name: Inspect stock boot metadata
        run: |
          source scripts/env.sh
          python3 scripts/inspect-stock.py 2>&1 | tee logs/inspect-stock.log
          python3 scripts/test-r1-power.py 2>&1 | tee logs/r1-power-tests.log
          python3 scripts/test-r1-touch.py 2>&1 | tee logs/r1-touch-tests.log
          toolchains/boot-tools/bin/python scripts/test-i2c-firmware.py 2>&1 | tee logs/i2c-firmware-tests.log
          toolchains/boot-tools/bin/python scripts/test-i2c-stock-timing.py 2>&1 | tee logs/i2c-stock-timing.log
          toolchains/boot-tools/bin/python scripts/test-i2c-stock-fifo.py 2>&1 | tee logs/i2c-stock-fifo.log
          toolchains/boot-tools/bin/python scripts/test-stock-backlight.py 2>&1 | tee logs/stock-backlight-tests.log
          toolchains/boot-tools/bin/python scripts/test-r1-panel.py 2>&1 | tee logs/r1-panel-tests.log
          toolchains/boot-tools/bin/python scripts/test-panel-power.py 2>&1 | tee logs/panel-power-tests.log
          toolchains/boot-tools/bin/python scripts/test-dsi-timing.py 2>&1 | tee logs/dsi-timing-tests.log
          toolchains/boot-tools/bin/python scripts/test-dsi-irq.py 2>&1 | tee logs/dsi-irq-tests.log
          toolchains/boot-tools/bin/python scripts/test-dsi-command.py 2>&1 | tee logs/dsi-command-tests.log
          toolchains/boot-tools/bin/python scripts/test-dsi-power.py 2>&1 | tee logs/dsi-power-tests.log
          toolchains/boot-tools/bin/python scripts/test-dsi-pipeline.py 2>&1 | tee logs/dsi-pipeline-tests.log
          toolchains/boot-tools/bin/python scripts/test-crtc-events.py 2>&1 | tee logs/crtc-events-tests.log
          python3 scripts/test-cmdq-flush.py 2>&1 | tee logs/cmdq-flush-tests.log
          python3 scripts/test-cmdq-power.py 2>&1 | tee logs/cmdq-power-tests.log
          toolchains/boot-tools/bin/python scripts/test-crtc-cmdq.py 2>&1 | tee logs/crtc-cmdq-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-phy.py 2>&1 | tee logs/mt6765-phy-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-display-path.py 2>&1 | tee logs/mt6765-display-path-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-smi.py 2>&1 | tee logs/mt6765-smi-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-iommu.py 2>&1 | tee logs/mt6765-iommu-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-address.py 2>&1 | tee logs/mt6765-address-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-fault.py 2>&1 | tee logs/mt6765-fault-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-fault-irq.py 2>&1 | tee logs/mt6765-fault-irq-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-rdma.py 2>&1 | tee logs/mt6765-rdma-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-rdma-irq.py 2>&1 | tee logs/mt6765-rdma-irq-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-ovl.py 2>&1 | tee logs/mt6765-ovl-tests.log
          toolchains/boot-tools/bin/python scripts/test-display-drain.py 2>&1 | tee logs/display-drain-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-ovl-plane.py 2>&1 | tee logs/mt6765-ovl-plane-tests.log
          toolchains/boot-tools/bin/python scripts/test-mt6765-plane-address.py 2>&1 | tee logs/mt6765-plane-address-tests.log

      - name: Patch LK and build the LineageOS splash
        run: |
          source scripts/env.sh
          toolchains/boot-tools/bin/python scripts/build-lk.py 2>&1 | tee logs/build-lk.log
          python3 scripts/test-lk-slots.py --stock firmware/stock-v0.8.293/lk.img \
            --patched dist/lk/lk.bin --build-record dist/lk/build.json \
            --out out/lk-slots-tests 2>&1 | tee logs/lk-slots-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk.py 2>&1 | tee logs/lk-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-mmc-fixup.py 2>&1 | tee logs/lk-mmc-fixup-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-platform-fixup.py 2>&1 | tee logs/lk-platform-fixup-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-boot-control.py 2>&1 | tee logs/lk-boot-control-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-display-stop.py 2>&1 | tee logs/lk-display-stop-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-display-handoff.py 2>&1 | tee logs/lk-display-handoff-tests.log

      - name: Build and check the mtkclient package
        run: |
          source scripts/env.sh
          python3 scripts/package-mtkclient.py 2>&1 | tee logs/package-mtkclient.log
          python3 scripts/test-flash-package.py 2>&1 | tee logs/flash-package-tests.log
          toolchains/boot-tools/bin/python scripts/test-lk-linux-fdt.py 2>&1 | tee logs/lk-linux-fdt-tests.log
          toolchains/boot-tools/bin/python scripts/test-atf-handoff.py 2>&1 | tee logs/atf-handoff-tests.log

      - name: Verify checksums and repeat packaging
        run: |
          source scripts/env.sh
          for directory in dist/mainline dist/bringup dist/lk dist/mtkclient; do
            (cd "$directory" && sha256sum -c SHA256SUMS)
          done
          (cd dist && sha256sum -c rabbit-r1-mainline-mtkclient.zip.sha256)
          sha256sum dist/lk/lk.bin dist/lk/logo.bin dist/bringup/initramfs.cpio.gz dist/rabbit-r1-mainline-mtkclient.zip > logs/repeat.sha256
          r1_build_time src/mainline
          python3 scripts/make-initramfs.py
          toolchains/boot-tools/bin/python scripts/build-lk.py
          python3 scripts/package-mtkclient.py
          sha256sum -c logs/repeat.sha256 | tee logs/reproducibility.log
          test -z "$(git -C src/mainline status --porcelain)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haretic-r1-mainline-${{ github.sha }}
          path: |
            /rabbitr1/dist/mainline/
            /rabbitr1/dist/bringup/
            /rabbitr1/dist/lk/
            /rabbitr1/dist/rabbit-r1-mainline-mtkclient.zip
            /rabbitr1/dist/rabbit-r1-mainline-mtkclient.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: haretic-r1-logs-${{ github.sha }}
          path: /rabbitr1/logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Describe the result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          {
            echo "haretic build result: $RESULT"
            echo
            echo 'Successful builds include the kernel, modules, initramfs, patched LK, LineageOS splash and mtkclient package.'
            echo 'The expdb profile enables persistent logging; the RAM profile disables eMMC.'
            echo 'CI checks image formats and software behavior. Hardware boot and persistence remain untested.'
          } >> "$GITHUB_STEP_SUMMARY"
